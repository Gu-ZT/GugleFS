services:
  ftp:
    image: delfer/alpine-ftp-server:latest
    environment:
      USERS: "guglefs|guglefs-test|/home/guglefs"
      ADDRESS: "127.0.0.1"
      MIN_PORT: "21000"
      MAX_PORT: "21010"
    ports:
      - "2121:21"
      - "21000-21010:21000-21010"

  sftp:
    image: atmoz/sftp:alpine
    command: "guglefs:guglefs-test:1001::upload"
    ports:
      - "2222:22"
