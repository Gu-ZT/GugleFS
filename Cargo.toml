[workspace]
resolver = "2"
members = [
  "crates/guglefs-core",
  "crates/guglefs-mount",
  "crates/guglefs-remote",
  "src-tauri",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "MIT"
rust-version = "1.85.1"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
diqwest = "=3.1.0"
percent-encoding = "2"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
