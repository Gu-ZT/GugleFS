[workspace]
resolver = "2"
members = [
  "crates/guglefs-core",
  "crates/guglefs-mount",
  "crates/guglefs-remote",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

