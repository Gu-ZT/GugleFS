name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Windows mount SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-winfsp.ps1 -Install

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file fuse3 libayatana-appindicator3-dev \
            libdbus-1-dev libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev \
            libxdo-dev pkg-config wget

      - name: Install macFUSE build runtime
        if: runner.os == 'macOS'
        run: brew install --cask macfuse

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ runner.os }}-quality

      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm run web:build

  prepare:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.info.outputs.release_id }}
      tag: ${{ steps.info.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            RELEASE_ID="${{ github.event.release.id }}"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            TAG="${VERSION}+build.${{ github.run_number }}"
            RELEASE_ID=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
            if [ -n "$RELEASE_ID" ]; then
              gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" \
                -f target_commitish="$SHA" \
                -f name="$TAG" \
                -F draft=false \
                -F prerelease=true \
                --silent
            else
              RELEASE_ID=$(gh api "repos/$REPO/releases" \
                -f tag_name="$TAG" \
                -f target_commitish="$SHA" \
                -f name="$TAG" \
                -F draft=false \
                -F prerelease=true \
                -F generate_release_notes=true \
                --jq .id)
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WinFsp SDK
        shell: pwsh
        run: ./scripts/prepare-winfsp.ps1 -Install

      - name: Set app version from release tag
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node scripts/set-release-version.mjs "$TAG"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          key: windows-x86_64-release
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --target x86_64-pc-windows-msvc --bundles nsis

  build-linux:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file fuse3 libayatana-appindicator3-dev \
            libdbus-1-dev libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev \
            libxdo-dev pkg-config wget
      - name: Set app version from release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node scripts/set-release-version.mjs "$TAG"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          key: linux-x86_64-release
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --bundles deb,appimage

  build-macos:
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install macFUSE build runtime
        run: brew install --cask macfuse
      - name: Set app version from release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node scripts/set-release-version.mjs "$TAG"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          key: macos-aarch64-release
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ vars.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ vars.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ vars.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ vars.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_TEAM_ID || '' }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --target aarch64-apple-darwin --bundles app,dmg
